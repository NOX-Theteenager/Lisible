<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relecture de CV · Lisible</title>
<meta name="theme-color" content="#1C1915">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
:root{--bg:#f3efe7;--panel:#fffdf9;--sub:#f8f4ec;--line:#e8e1d4;--line2:#d8cfbf;--tx:#1c1915;--mu:#6b6459;--fa:#9a9285;--ac:#e8481c;--acs:#ffe6db;--btn:#1c1915;--btnfg:#fffdf9;--er:#cc3127;--ers:#fde5e2;--ok:#1b8455;--oks:#e1f3e9}
@media (prefers-color-scheme:dark){:root{--bg:#12110f;--panel:#1b1916;--sub:#221f1b;--line:#2f2b26;--line2:#403a33;--tx:#f2ede4;--mu:#aca394;--fa:#7c7469;--ac:#ff6a3d;--acs:#3a1f15;--btn:#f2ede4;--btnfg:#12110f;--er:#f47b70;--ers:#331617;--ok:#5fd39a;--oks:#13281d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Instrument Sans',system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:1fr}}
header{max-width:1100px;margin:0 auto;padding:20px 16px 0;display:flex;align-items:center;gap:12px}
.logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.03em}.logo b{color:var(--ac)}
.mark{width:32px;height:32px;border-radius:9px;background:var(--ac);display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;gap:2px}.mark i{width:4px;height:18px;border-radius:2px;background:#fff}.mark i+i{height:4px;background:#1c1915}
.paper{background:#fff;color:#1a1a1a;border:1px solid var(--line);border-radius:8px;padding:40px 44px;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.45}
.paper h1{margin:0;font-size:24px}.paper .t{font-weight:600;color:#333;margin-top:2px}.paper .c{font-size:11.5px;color:#444;margin-top:6px}
.paper h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #222;padding-bottom:3px;margin:18px 0 8px}
.paper ul{margin:3px 0 8px;padding-left:18px}.paper p{margin:0 0 4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:17px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mu)}
input,select,textarea{font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);color:var(--tx)}
button{font:inherit;font-weight:600;height:40px;border:0;border-radius:999px;background:var(--btn);color:var(--btnfg);cursor:pointer}button[disabled]{opacity:.6}
.cm{padding:10px 12px;border-radius:12px;background:var(--sub);font-size:13px}.cm b{display:block;font-size:12px;color:var(--mu)}
.msg{padding:10px 12px;border-radius:10px;font-weight:600;font-size:13px}.err{background:var(--ers);color:var(--er)}.ok{background:var(--oks);color:var(--ok)}
.muted{color:var(--mu);font-size:12.5px}
</style>
</head>
<body>
<header><span class="mark" aria-hidden="true"><i></i><i></i></span><span class="logo">lisible<b>.</b></span><span class="muted" id="vname"></span></header>
<main class="wrap" id="app"><div class="card"><span class="muted">Chargement du CV…</span></div></main>
<footer style="max-width:1100px;margin:0 auto;padding:0 16px 32px;display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px"><a href="/confidentialite" style="color:var(--mu)">Confidentialité</a><a href="/conditions" style="color:var(--mu)">Conditions d’utilisation</a><a href="/mentions-legales" style="color:var(--mu)">Mentions légales</a></footer>
<script>
const LABELS={summary:'Résumé professionnel',experience:'Expérience professionnelle',education:'Formation',skills:'Compétences',languages:'Langues',projects:'Projets',certifications:'Certifications',contact:'Coordonnées'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const token=location.pathname.split('/').pop();
let sb,data;
function dates(e){return [e.start,e.end].filter(Boolean).join(' – ');}
function cvHtml(cv){const c=cv.contact||{};const order=cv.order||['summary','experience','education','skills','languages','projects','certifications'];
  let h=`<h1>${esc(c.name)}</h1><div class="t">${esc(c.title)}</div><div class="c">${esc([c.city,c.phone,c.email,c.linkedin,c.github].filter(Boolean).join(' | '))}</div>`;
  order.forEach(k=>{let b='';
    if(k==='summary'&&cv.summary)b=`<p>${esc(cv.summary)}</p>`;
    if(k==='experience')b=(cv.experiences||[]).filter(e=>e.role||e.company).map(e=>`<p><b>${esc(e.role)}${e.company?' — '+esc(e.company):''}</b></p><p>${esc([e.city,dates(e)].filter(Boolean).join(' | '))}</p><ul>${(e.bullets||[]).filter(x=>x.trim()).map(x=>'<li>'+esc(x)+'</li>').join('')}</ul>`).join('');
    if(k==='education')b=(cv.education||[]).filter(e=>e.degree).map(e=>`<p><b>${esc(e.degree)}</b></p><p>${esc([e.school,e.city,dates(e)].filter(Boolean).join(' | '))}</p>${e.details?'<p>'+esc(e.details)+'</p>':''}`).join('');
    if(k==='skills'&&(cv.skills||[]).length)b=`<p>${esc(cv.skills.join(', '))}</p>`;
    if(k==='languages')b=(cv.languages||[]).filter(l=>l.name).length?`<p>${esc(cv.languages.filter(l=>l.name).map(l=>l.name+' : '+l.level).join(' ; '))}</p>`:'';
    if(k==='projects')b=(cv.projects||[]).filter(p=>p.name).map(p=>`<p><b>${esc(p.name)}</b> — ${esc(p.desc)} ${p.link?'('+esc(p.link)+')':''}</p>`).join('');
    if(k==='certifications')b=(cv.certifications||[]).filter(x=>x.name).map(x=>`<p>${esc([x.name,x.issuer,x.date].filter(Boolean).join(' — '))}</p>`).join('');
    if(b)h+=`<h2>${esc(LABELS[k])}</h2>${b}`;});
  return h;}
function render(note){const can=data.perm==='comment';
  document.getElementById('vname').textContent='· Relecture de « '+(data.versionName||'CV')+' »';
  document.getElementById('app').innerHTML=`<article class="paper">${cvHtml(data.cv||{})}</article>
  <aside style="display:flex;flex-direction:column;gap:14px">
    ${can?`<form class="card" id="f"><h3>Laisser un commentaire</h3><span class="muted">Vos remarques sont envoyées à la personne qui vous a partagé ce CV. Aucun compte n’est nécessaire.</span>
      <label>Votre prénom<input name="author" maxlength="80" required autocomplete="given-name"></label>
      <label>Section<select name="section">${Object.keys(LABELS).map(k=>`<option value="${k}">${LABELS[k]}</option>`).join('')}</select></label>
      <label>Commentaire<textarea name="body" rows="5" maxlength="2000" required></textarea></label>
      ${note||''}<button type="submit">Envoyer</button><span class="muted">Votre prénom et votre commentaire sont transmis à la personne qui vous a partagé ce CV et supprimés au plus tard 30 jours après l’expiration du lien. <a href="/confidentialite" target="_blank" rel="noopener">Politique de confidentialité</a></span></form>`:`<div class="card"><h3>Lecture seule</h3><span class="muted">Ce lien permet de lire le CV sans laisser de commentaire.</span></div>`}
    <div class="card"><h3>Commentaires (${data.comments.length})</h3>${data.comments.length?data.comments.map(c=>`<div class="cm"><b>${esc(c.author)} · ${esc(LABELS[c.section]||c.section)}</b>${esc(c.body)}</div>`).join(''):'<span class="muted">Aucun commentaire pour l’instant.</span>'}</div>
    <span class="muted">Lien valable jusqu’au ${new Date(data.expiresAt).toLocaleDateString('fr-FR')}.</span>
  </aside>`;
  const f=document.getElementById('f');if(f)f.onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(f),btn=f.querySelector('button');btn.disabled=true;
    const {error}=await sb.rpc('add_share_comment',{p_token:token,p_author:fd.get('author'),p_section:fd.get('section'),p_body:fd.get('body')});
    if(error){btn.disabled=false;render('<div class="msg err">'+esc(error.message)+'</div>');return;}
    await load();render('<div class="msg ok">Merci, votre commentaire a été envoyé.</div>');};}
async function load(){const {data:d,error}=await sb.rpc('get_shared_cv',{p_token:token});if(error)throw error;data=d;}
(async()=>{try{
  const cfg=await (await fetch('/api/config')).json();if(!cfg.supabaseUrl)throw new Error('Service de partage non configuré.');
  await new Promise((res,rej)=>{const s=document.createElement('script');s.src='/vendor/supabase.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
  sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:false}});
  await load();
  if(!data){document.getElementById('app').innerHTML='<div class="card"><h3>Lien indisponible</h3><span class="muted">Ce lien de relecture a expiré ou a été révoqué.</span></div>';return;}
  render();
}catch(e){document.getElementById('app').innerHTML='<div class="card"><h3>Erreur</h3><span class="muted">'+esc(e.message||e)+'</span></div>';}})();
</script>
</body>
</html>
